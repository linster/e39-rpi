// Accounts: where calendars come from and sync to.
//
// An account is one Akonadi resource (agent instance): a CalDAV server, a
// Google account, a mail account (IMAP), or (for tests) a local .ics file.
// The bridge creates and configures them, since Akonadi's own setup dialogs
// need a desktop.
//
// A mail account is three things the bridge creates and removes together:
// the IMAP account (the resource: reading), an SMTP server (sending) and an
// identity (the sender's name and address, which SMTP server to use).
//
// Accounts that log in with OAuth (Google) need a browser: adding one, or a
// login that has expired, starts a login that the HMI shows through
// AuthService. Expired access tokens are refreshed without the browser;
// only a revoked or expired refresh token needs the user.

syntax = "proto3";

package e39pim.v1;

import "google/protobuf/empty.proto";

option java_package = "ca.stefanm.e39pim.v1";
option java_multiple_files = true;
option java_outer_classname = "AccountProto";

service AccountService {
  // By name.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  // The whole list first, then again whenever any account changes (added,
  // removed, renamed, online/offline, sync progress, errors).
  rpc WatchAccounts(WatchAccountsRequest) returns (stream ListAccountsResponse);
  // Creates a CalDAV account, stores its password and starts a first sync.
  // Use an app password where the server offers them. The login is tried
  // first: UNAUTHENTICATED if the server refuses it, UNAVAILABLE if the
  // server can't be reached (message: why); nothing is created then.
  // INVALID_ARGUMENT for a malformed URL or a missing user name/password.
  rpc AddCalDavAccount(AddCalDavAccountRequest) returns (Account);
  // Creates a Google account and starts its login: an AuthRequest appears
  // on AuthService.WatchAuthRequests. The account says needs_login until
  // the login finishes.
  rpc AddGoogleAccount(AddGoogleAccountRequest) returns (StartLoginResponse);
  // Finds an e-mail address's IMAP and SMTP servers, like mail programs'
  // account wizards: the provider database (Thunderbird's ISPDB), the
  // domain's own autoconfig file, the ISPDB entry of the domain's mail
  // server (MX: custom domains at big providers), DNS SRV records (RFC
  // 6186), then the usual host names (imap.<domain>, ...) if they answer.
  // NOT_FOUND if nothing turned up (ask for the servers); INVALID_ARGUMENT
  // for something that isn't an e-mail address.
  rpc DiscoverMailSettings(DiscoverMailSettingsRequest) returns (DiscoverMailSettingsResponse);
  // Creates a mail account: IMAP account, SMTP server and identity, with
  // the servers given or discovered (DiscoverMailSettings), and starts a
  // first sync. Both logins are tried first: UNAUTHENTICATED if a server
  // refuses the password, UNAVAILABLE if it can't be reached (message:
  // which server and why); nothing is created then. Servers said to want a
  // browser login (OAuth2) get the password too (app passwords);
  // FAILED_PRECONDITION if they refuse it (e.g. Outlook.com). INVALID_ARGUMENT
  // for a malformed address or missing password.
  rpc AddMailAccount(AddMailAccountRequest) returns (Account);
  // Starts a new login for an account that says needs_login.
  // FAILED_PRECONDITION for account types without OAuth.
  rpc StartLogin(StartLoginRequest) returns (StartLoginResponse);
  // Removes the account, its stored password/tokens and its local copy of
  // the data (nothing on the server is deleted). Mail accounts: also their
  // SMTP server and identity.
  rpc RemoveAccount(RemoveAccountRequest) returns (google.protobuf.Empty);
  // Offline accounts don't sync (data stays readable). Akonadi also takes
  // accounts offline by itself when the network is down.
  rpc SetAccountOnline(SetAccountOnlineRequest) returns (Account);
  // Sync now instead of at the next interval.
  rpc SyncNow(SyncNowRequest) returns (google.protobuf.Empty);
  // CalDAV accounts: also sync the server's address books (CardDAV), or
  // stop (their contacts are removed from the car, not from the server).
  // FAILED_PRECONDITION for other account types (Google accounts always
  // have contacts, mail accounts never).
  rpc SetContactsEnabled(SetContactsEnabledRequest) returns (Account);
}

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_OTHER = 1;      // created outside the bridge; see type_name
  ACCOUNT_TYPE_CALDAV = 2;     // akonadi_davgroupware_resource
  ACCOUNT_TYPE_GOOGLE = 3;     // akonadi_google_resource
  ACCOUNT_TYPE_ICAL_FILE = 4;  // akonadi_ical_resource (tests, local files)
  ACCOUNT_TYPE_IMAP = 5;       // akonadi_imap_resource (mail)
}

enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_IDLE = 1;            // online, nothing to do
  ACCOUNT_STATE_SYNCING = 2;         // see progress_percent
  ACCOUNT_STATE_OFFLINE = 3;
  ACCOUNT_STATE_NOT_CONFIGURED = 4;  // missing settings (or still setting up)
  ACCOUNT_STATE_BROKEN = 5;          // see status_message
}

message Account {
  string id = 1;
  AccountType type = 2;
  // Akonadi's agent type, e.g. "akonadi_davgroupware_resource".
  string type_name = 3;
  string name = 4;
  bool online = 5;
  AccountState state = 6;
  // What the account says it's doing or what went wrong, in its words
  // (English).
  string status_message = 7;
  // 0 .. 100 while syncing, else 0.
  int32 progress_percent = 8;
  // The login has to be done (again) in a browser: AccountService.StartLogin.
  bool needs_login = 9;
  // The last error the account reported, in its words (English), e.g. a
  // sync that failed because the server refused the password; empty once a
  // sync went through without errors. Errors don't always make the state
  // BROKEN: most accounts go back to IDLE and try again at the next sync.
  string last_error = 10;
  // Mail accounts: the address mail is sent from and the sender's name
  // (the identity's); empty for other accounts.
  string email_address = 11;
  string sender_name = 12;
  // Contacts are synced from this account (ContactService).
  bool contacts_enabled = 13;
}

// How a connection to a mail server is encrypted.
enum MailSecurity {
  MAIL_SECURITY_UNSPECIFIED = 0;
  MAIL_SECURITY_TLS = 1;       // TLS from the start (IMAPS 993, SMTPS 465)
  MAIL_SECURITY_STARTTLS = 2;  // plain, then STARTTLS (IMAP 143, submission 587)
  MAIL_SECURITY_NONE = 3;      // no encryption (only for local test servers)
}

// How a mail server takes the login.
enum MailAuthMethod {
  MAIL_AUTH_METHOD_UNSPECIFIED = 0;
  // A password, sent as is (PLAIN, LOGIN; protected by TLS).
  MAIL_AUTH_METHOD_PASSWORD = 1;
  // A password, hashed (CRAM-MD5).
  MAIL_AUTH_METHOD_PASSWORD_ENCRYPTED = 2;
  // A browser login (OAuth2): not supported for mail accounts yet;
  // AddMailAccount tries the password (an app password) instead.
  MAIL_AUTH_METHOD_OAUTH2 = 3;
}

message MailServer {
  string host = 1;
  int32 port = 2;
  MailSecurity security = 3;
  // The login name; empty = the e-mail address.
  string username = 4;
  // UNSPECIFIED = PASSWORD.
  MailAuthMethod auth = 5;
}

message MailSettings {
  MailServer imap = 1;
  MailServer smtp = 2;
}

enum MailSettingsSource {
  MAIL_SETTINGS_SOURCE_UNSPECIFIED = 0;
  MAIL_SETTINGS_SOURCE_ISPDB = 1;        // Thunderbird's provider database
  MAIL_SETTINGS_SOURCE_PROVIDER = 2;     // the domain's autoconfig file
  MAIL_SETTINGS_SOURCE_MX = 3;           // the ISPDB entry of the domain's mail server
  MAIL_SETTINGS_SOURCE_DNS_SRV = 4;      // SRV records (RFC 6186)
  MAIL_SETTINGS_SOURCE_GUESS = 5;        // imap.<domain> and the like answered
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message WatchAccountsRequest {}

message AddCalDavAccountRequest {
  // Shown in the HMI; empty = the server's host name.
  string name = 1;
  // The server's CalDAV URL (or a URL on the server the account can be
  // discovered from), e.g. "https://cloud.example.com/remote.php/dav".
  string url = 2;
  string username = 3;
  string password = 4;
  // How often to sync, in minutes; 0 = the default (5).
  int32 refresh_interval_minutes = 5;
  // Also sync the server's address books (CardDAV, found from the same
  // URL).
  bool contacts = 6;
}

message AddGoogleAccountRequest {
  // Not used yet: the Google resource names itself "Google Groupware
  // (<e-mail>)" whenever it (re)loads its settings.
  string name = 1;
  // E-mail to suggest on Google's login page; optional.
  string login_hint = 2;
}

message DiscoverMailSettingsRequest {
  string email = 1;
}

message DiscoverMailSettingsResponse {
  MailSettings settings = 1;
  MailSettingsSource source = 2;
  // The provider's name, if known (e.g. "Fastmail").
  string provider_name = 3;
  // True when the provider prefers a browser login (OAuth2): a password
  // then usually has to be an app password (Gmail, iCloud, Yahoo,
  // Fastmail). Also set when only OAuth2 is listed (auth OAUTH2): an app
  // password may still work.
  bool app_password_needed = 4;
}

message AddMailAccountRequest {
  string email = 1;
  string password = 2;
  // The sender's name in sent mail ("Stefan Linster").
  string sender_name = 3;
  // Shown in the HMI; empty = the e-mail address.
  string name = 4;
  // The servers; unset = discovered (DiscoverMailSettings).
  MailSettings settings = 5;
  // How often to check for new mail, in minutes; 0 = the default (5).
  int32 check_interval_minutes = 6;
}

message StartLoginRequest {
  string account_id = 1;
}

message StartLoginResponse {
  Account account = 1;
  // The AuthRequest (AuthService) for this login.
  string auth_request_id = 2;
}

message RemoveAccountRequest {
  string account_id = 1;
}

message SetAccountOnlineRequest {
  string account_id = 1;
  bool online = 2;
}

message SetContactsEnabledRequest {
  string account_id = 1;
  bool enabled = 2;
}

message SyncNowRequest {
  // Empty = all accounts.
  string account_id = 1;
}
